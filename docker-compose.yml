services:
  app:
    image: internet-applications-project-app:latest
    build:
      context: ./laravel-app
      target: app
    restart: unless-stopped
    environment:
      APP_NAME: NovaCart
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: novacart
      DB_USERNAME: novacart
      DB_PASSWORD: ${DB_PASSWORD:-novacart}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      JWT_TTL: ${JWT_TTL:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      INVENTORY_GRPC_ADDRESS: inventory:50051
      INVENTORY_TIMEOUT_MS: ${INVENTORY_TIMEOUT_MS:-2000}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      inventory:
        condition: service_healthy

  web:
    image: internet-applications-project-web:latest
    build:
      context: ./laravel-app
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novacart
      POSTGRES_USER: novacart
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novacart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacart -d novacart"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory:
    image: internet-applications-project-inventory:latest
    build:
      context: ./nodejs-inventory
      additional_contexts:
        proto: ./proto
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://inventory:${INVENTORY_DB_PASSWORD:-inventory}@inventory-db:5432/inventory
      GRPC_PORT: 50051
      INVENTORY_ARTIFICIAL_DELAY_MS: ${INVENTORY_ARTIFICIAL_DELAY_MS:-0}
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  inventory-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
    volumes:
      - inventory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage:
  pgdata:
  inventory-pgdata: